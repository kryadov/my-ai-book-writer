# Managed by repo-guard: https://github.com/kryadov/repo-guard
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/android/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
